[force_move]
enable_force_move: True


[AFC_extruder extruder]
pin_tool_start: ^!PC2           # Filamatrix twin sensor, before extruder gears
buffer: Turtle_1
pin_tool_end: ~PA15             # Filamatrix twin sensor, after extruder gears. ~ needs local AFC patch (strip("!^~"), see ~/afc-local.patch on pi)
tool_stn: 72                    # Post sensor -> nozzle, measured 2026-10-04. See documentation for details on how to calculate this value. https://www.afcproject.dev/toolhead/calculation.html
tool_stn_unload: 100            # See documentation for details on how to calculate this value. https://www.afcproject.dev/toolhead/calculation.html
tool_sensor_after_extruder: 0   # Extra distance to move in mm once pre/post sensors are clear. Useful for when only using post sensor, so this distance can be the amount to move to clear extruder gears
tool_unload_speed: 25           # Unload speed in mm/s when unloading toolhead. Default is 25mm/s.
tool_load_speed: 5              # Load speed in mm/s when loading toolhead. Default is 25mm/s. 25 outran the hotend (clicking) on the tool_stn push.

#[filament_switch_sensor bypass]
#switch_pin: turtleneck:PB5
#pause_on_runout: False


