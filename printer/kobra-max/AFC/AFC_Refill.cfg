# LOCAL: kick_cmd in AFC.cfg points here instead of AFC_KICK.
# AFC_POOP ends with a purge_retract (16 mm) so the nozzle doesn't ooze during the kick.
# This pushes most of it back right after the kick, so the brush wipes off the ooze and the
# nozzle is primed after any tool change: slicer, manual, or print start.
# Before this, the refill lived in Orca's change-filament gcode, so manual changes, print-start
# changes, and prints cancelled mid-change were left 16 mm retracted.

[gcode_macro AFC_KICK_REFILL]
description: AFC_KICK, then push back AFC_POOP's purge_retract (minus refill_short)
variable_refill_short: 1.0   # mm left retracted for the travel from the brush (was Orca's "minus 1")
gcode:
  AFC_KICK {rawparams}
  {% set pv = printer['gcode_macro _AFC_POOP_VARS'] %}
  {% set refill = pv.purge_retract|float - refill_short|float %}
  {% if refill > 0 and printer.toolhead.extruder and printer[printer.toolhead.extruder].can_extrude %}
    SAVE_GCODE_STATE NAME=_afc_refill
    M83
    G1 E{refill} F{pv.purge_retract_speed|float * 60}
    RESTORE_GCODE_STATE NAME=_afc_refill
  {% endif %}
