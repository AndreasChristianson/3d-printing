# LOCAL: re-home X at the end of a tool change.
# The cut, kick and brush can all skip X steps (the kick plows a fresh poop at Z 0.5), so X
# is re-homed after the wipe, the last X move before the print resumes, instead of right after
# the cut. The 2026-11-06 X+ layer shift happened after the post-cut home, during the kick or brush.
# wipe_cmd in AFC.cfg points at AFC_BRUSH_REHOME. Cut.cfg still calls _AFC_REHOME_X when
# rehome_x_after_cut is True.
#
# The brush sits on the bed and only lifts z_move (10 mm) after wiping, which can be below a tall
# print, so the post-wipe re-home first climbs to the tool change's z_hop height. AFC_CUT records
# that height in safe_z (AFC lifts z_hop just before calling the cut). With no cut this change
# (first load of a print) it falls back to current Z + AFC z_hop.

[gcode_macro _AFC_REHOME_X]
description: Travel fast to rehome_x_approach mm short of the X endstop, then G28 X. MIN_Z= lifts first.
variable_safe_z: 0
gcode:
  {% set vars = printer['gcode_macro _AFC_CUT_TIP_VARS'] %}
  {% set gVars = printer['gcode_macro _AFC_GLOBAL_VARS'] %}
  {% set sx = printer.configfile.settings.stepper_x %}
  {% set approach = vars['rehome_x_approach']|default(10)|float %}
  {% set approach_speed = vars['rehome_x_approach_speed']|default(gVars['travel_speed'])|float * 60 %}
  {% set z_speed = gVars['z_travel_speed']|default(30)|float * 60 %}
  {% set min_z = params.MIN_Z|default(-1000)|float %}
  {% set z_max = printer.toolhead.axis_maximum.z %}
  SAVE_GCODE_STATE NAME=_afc_rehome_x
  G90
  {% if printer.toolhead.position.z < min_z %}
    G1 Z{[min_z, z_max]|min} F{z_speed}
  {% endif %}
  {% if sx.position_endstop > (sx.position_min + sx.position_max) / 2 %}  # endstop at the max end
    G1 X{sx.position_endstop - approach} F{approach_speed}
  {% else %}
    G1 X{sx.position_endstop + approach} F{approach_speed}
  {% endif %}
  G28 X
  RESTORE_GCODE_STATE NAME=_afc_rehome_x

[gcode_macro AFC_BRUSH_REHOME]
description: AFC_BRUSH, then re-home X at the tool change's z_hop height if rehome_x_after_wipe is True
gcode:
  {% set z_hop = printer.configfile.settings.afc.z_hop|default(0)|float %}
  {% set saved_z = printer['gcode_macro _AFC_REHOME_X'].safe_z|float %}
  {% set safe_z = saved_z if saved_z > 0 else printer.toolhead.position.z + z_hop %}
  AFC_BRUSH {rawparams}
  {% if printer['gcode_macro _AFC_CUT_TIP_VARS']['rehome_x_after_wipe']|default(false)|string|lower == 'true' %}
    _AFC_REHOME_X MIN_Z={safe_z}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AFC_REHOME_X VARIABLE=safe_z VALUE=0
