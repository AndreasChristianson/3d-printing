#####################################################################
#   AFC-side hooks for the status LEDs (stealthburner_leds.cfg)
#####################################################################
# LOCAL file, not part of AFC. It sorts after AFC.cfg in the
# [include AFC/*.cfg] glob, which the M109 wrapper depends on.

# --- BT busy: tool change / lane load-unload ---
# AFC.cfg points tool_cut_cmd, park_cmd and park_pre_load_cmd here: cut
# and park are the first steps of every unload and load.

[gcode_macro _STATUS_AFC_CUT]
gcode:
    _STATUS_SET STATE=busy DEV=bt
    AFC_CUT {rawparams}

[gcode_macro _STATUS_AFC_PARK]
gcode:
    _STATUS_SET STATE=busy DEV=bt
    AFC_PARK {rawparams}

# --- heating wait (hotend) ---
# AFC replaces M109 at klippy:connect with its own command, which sets the
# heater directly and never calls the command it renamed. So this wrapper
# has to rename AFC's M109, not the other way around: its connect handler
# must run after [AFC]'s, i.e. this section must load after [AFC].
# Orange only if the wait will actually heat. A BT busy with a tool change
# (AFC may M109 mid-change) keeps its purple.

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% if params.S|default(0)|float - printer.extruder.temperature > v.heat_delta %}
        _STATUS_SET STATE=heating DEV={ "sb" if v.bt == "busy" else "both" }
    {% endif %}
    M109.1 {rawparams}
