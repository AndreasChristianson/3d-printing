[include mainsail.cfg]
[include stealthburner_leds.cfg]
[include print_watch.cfg]

[virtual_sdcard]
path: /home/sullage/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC0
# X origin moved +5 mm (2026-11-03): X=0 is the AFC park/purge spot, where the cutter arm sits
# ~1 mm off the depressor pin -- the furthest -X the nozzle goes without cutting. Only the cut
# goes negative (to X=-8; the arm hard-stops at ~X-10.2).
position_endstop: 375
position_max: 375  # = endstop: nothing goes past the switch. Cartographer sizes scan U-turn arcs to this (was 380 -> turns hit X 379.5)
homing_speed: 60
position_min: -15

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
# stealthchop_threshold omitted on purpose: any value (even 0) enables StealthChop.
# Pure SpreadCycle gives more torque under load (filament cutter).

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1
position_max: 424
homing_speed: 50
position_endstop: -10
position_min: -10

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.9
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
homing_retract_dist: 0
# endstop_pin: PC2
position_max: 335
position_min: -5

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.00
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
max_extrude_only_distance: 120.0
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PA0
min_temp: 5
max_temp: 300
pressure_advance: 0
rotation_distance: 47.653
gear_ratio: 9:1
microsteps: 16

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.6

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PB15
heater: extruder

# [heater_fan controller_fan]
# pin: PC7

[fan]
pin: PC6

[temperature_fan mcu_fan]
pin: PC7                  
max_power: 0.8
hardware_pwm: true
control: watermark
sensor_type: temperature_mcu
min_temp: 10
max_temp: 80
target_temp: 40.0            # Desired temperature to maintain
min_speed: 0.0


[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5A0038000F50415833323520-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100

[skew_correction]
# Length AC = 140.8
# Length BD = 141.1
# Length AD = 99.3

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# See the sample-lcd.cfg file for definitions of common LCD displays.

# [bltouch]
# sensor_pin: ^PC14
# control_pin: PA1
# x_offset: 35
# y_offset: 13

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_60002500135030514B343620-if00
restart_method: command # Not needed for probes using CAN. 

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 15 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: yes # For extra output

# [bed_mesh]
# speed: 100
# algorithm: bicubic
# mesh_pps: 3, 3
# horizontal_move_z: 10
# mesh_min: 40, 20
# mesh_max: 370, 415
# probe_count: 8, 8
# fade_start: 5
# fade_end: 20
# zero_reference_position: 200, 200

[bed_mesh]
zero_reference_position: 190, 210
speed: 200
horizontal_move_z: 3
mesh_min: 25, 20
mesh_max: 370, 365  # 5 mm in from X max 375: Cartographer U-turn radius = 375-370-0.5 = 4.5, turns peak at X 374.5 (probe x_offset 0)
probe_count: 12, 12
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[mcu rpi]
# Klipper host MCU on the Pi itself (klipper-mcu.service); reads the bed accelerometer
serial: /tmp/klipper_host_mcu

[adxl345 bed]
# Temporary ADXL345 on the bed for Y resonance, wired to the Pi's SPI0 header pins
# (1 3V3, 6 GND, 19 MOSI, 21 MISO, 23 SCLK, 24 CE0). Plug in only after parking at the probe point.
cs_pin: rpi:None
spi_bus: spidev0.0

[resonance_tester]
accel_chip_x: adxl345      # Cartographer, on the toolhead
accel_chip_y: adxl345 bed  # on the bed (bedslinger Y)
probe_points:
    190, 210, 80 # Z 80 keeps the nozzle clear of the bed-mounted sensor

[input_shaper]
shaper_freq_x: 54.0  # SHAPER_CALIBRATE AXIS=X with Cartographer ADXL345, 2026-10-31 (was 56.6; 0.0% vibration, max_accel <= 8600)
shaper_type_x: mzv
shaper_freq_y: 26.2  # SHAPER_CALIBRATE AXIS=Y with bed-mounted ADXL345, 2026-10-31 (0.2% vibration, max_accel <= 2000)
shaper_type_y: mzv

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[temperature_sensor host]
sensor_type: temperature_host

[safe_z_home]
home_xy_position: 190,210
z_hop: 10
z_hop_speed: 50
speed: 200.0

[gcode_macro G420]
gcode:
   BED_MESH_PROFILE LOAD=default

[idle_timeout]
gcode:
   M104 S0
   STATUS_OFF
timeout: 600

[exclude_object]

[neopixel sb_leds]
pin: PA8
#   The pin connected to the neopixel. This parameter must be provided.
chain_count: 3
#   The number of Neopixel chips that are "daisy chained" to the
#   provided pin. The default is 1 (which indicates only a single
#   Neopixel is connected to the pin).
color_order: GRBW
#   Set the pixel order required by the LED hardware. Options are GRB,
#   RGB, GRBW, or RGBW. The default is GRB.
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
#   Sets the initial LED color of the Neopixel. Each value should be
#   between 0.0 and 1.0. The WHITE option is only available on RGBW
#   LEDs. The default for each color is 0.#
  

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE2
gcode:
  SET_PRINT_STATS_INFO_BASE2 {rawparams}
  UPON_LAYER {rawparams}

# Mainsail client hooks -> Stealthburner LED states.
# (mainsail.cfg is read-only; these fire from within its PAUSE/RESUME/CANCEL.)
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro : "STATUS_PAUSE"
variable_user_resume_macro: "STATUS_PRINTING"
variable_user_cancel_macro: "STATUS_OFF"
gcode:

# Twin sensors now owned by AFC (pin_tool_start/pin_tool_end in AFC/AFC_Hardware.cfg).
