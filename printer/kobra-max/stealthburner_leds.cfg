#####################################################################
#   Stealthburner LED status  (status-driven)
#####################################################################
#
# Drives [neopixel sb_leds] (in printer.cfg).
# chain_count 3 -> index 1 = logo, index 2 & 3 = nozzle. Hardware RGBW,
# so colors are (R, G, B, W), each 0.0-1.0.
#
# The LEDs follow the printer automatically via [_sb_status_monitor]:
#   error print          -> red
#   paused               -> amber
#   printing, up to temp  -> green logo + white nozzle
#   printing, below temp  -> heating (red/orange)
#   heater on, below temp -> heating   (works from a bare M104/M140 too)
#   heaters off, still hot -> cooling (blue) until under 50C
#   homing / meshing      -> purple / green (via G28 & BED_MESH_CALIBRATE)
#   otherwise (idle/rest) -> off
#
# Manual override for testing: run any STATUS_* macro. To stop the
# monitor from taking back over, run  SB_AUTO ENABLE=0  (SB_AUTO ENABLE=1
# to resume).
#####################################################################

[gcode_macro _sb_vars]
# Central place to tweak colors, pixel mapping, and monitor behavior.
variable_logo_led_name:         "sb_leds"   ; neopixel name (no [neopixel ])
variable_logo_idx:              "1"         ; logo pixel index
variable_nozzle_idx:            "2,3"       ; nozzle pixel indices
variable_heat_delta:            2.0         ; >this far below target = "heating"
variable_cool_temp:             50.0        ; above this with heater off = "cooling"

# monitor state (do not edit; managed at runtime)
variable_auto:                  True        ; monitor drives the LEDs
variable_current:               "init"      ; last state the monitor applied

# color format: (R, G, B, W) each 0.0-1.0
variable_colors: {
        'logo': {
            'off':        (0.0, 0.0, 0.0, 0.0),
            'ready':      (0.0, 0.0, 0.0, 0.15),
            'busy':       (0.4, 0.2, 0.0, 0.0),
            'heating':    (0.6, 0.1, 0.0, 0.0),
            'cooling':    (0.0, 0.1, 0.6, 0.0),
            'homing':     (0.4, 0.0, 0.6, 0.0),
            'leveling':   (0.0, 0.4, 0.4, 0.0),
            'meshing':    (0.0, 0.5, 0.0, 0.0),
            'calibrating_z': (0.6, 0.0, 0.3, 0.0),
            'printing':   (0.0, 0.4, 0.0, 0.0),
            'pause':      (0.6, 0.25, 0.0, 0.0),
            'error':      (0.8, 0.0, 0.0, 0.0),
        },
        'nozzle': {
            'off':        (0.0, 0.0, 0.0, 0.0),
            'ready':      (0.0, 0.0, 0.0, 0.3),
            'busy':       (0.0, 0.0, 0.0, 0.3),
            'heating':    (0.8, 0.35, 0.0, 0.0),
            'cooling':    (0.0, 0.1, 0.6, 0.0),
            'homing':     (0.0, 0.0, 0.0, 0.3),
            'leveling':   (0.0, 0.0, 0.0, 0.3),
            'meshing':    (0.0, 0.0, 0.0, 0.3),
            'calibrating_z': (0.0, 0.0, 0.0, 0.3),
            'printing':   (0.0, 0.0, 0.0, 1.0),
            'pause':      (0.7, 0.3, 0.0, 0.0),
            'error':      (0.8, 0.0, 0.0, 0.0),
        }
    }
gcode:
# no-op; this macro only holds variables

#####################################################################
#   Low-level helpers
#####################################################################

[gcode_macro _set_sb_leds]
gcode:
    {% set r = params.RED|default(0)|float %}
    {% set g = params.GREEN|default(0)|float %}
    {% set b = params.BLUE|default(0)|float %}
    {% set w = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].logo_led_name %}
    {% set idx = params.IDX|string %}
    {% for i in idx.split(',') %}
        set_led led={led} red={r} green={g} blue={b} white={w} index={i} transmit={loop.last|int}
    {% endfor %}

[gcode_macro _set_logo]
gcode:
    {% set c = printer["gcode_macro _sb_vars"].colors.logo[params.COLOR] %}
    _set_sb_leds IDX={printer["gcode_macro _sb_vars"].logo_idx} RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={c[3]}

[gcode_macro _set_nozzle]
gcode:
    {% set c = printer["gcode_macro _sb_vars"].colors.nozzle[params.COLOR] %}
    _set_sb_leds IDX={printer["gcode_macro _sb_vars"].nozzle_idx} RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={c[3]}

#####################################################################
#   Status macros (manual or called by the monitor / wrappers)
#####################################################################

[gcode_macro STATUS_OFF]
gcode:
    _set_logo COLOR=off
    _set_nozzle COLOR=off

[gcode_macro STATUS_READY]
gcode:
    _set_logo COLOR=ready
    _set_nozzle COLOR=ready

[gcode_macro STATUS_BUSY]
gcode:
    _set_logo COLOR=busy
    _set_nozzle COLOR=busy

[gcode_macro STATUS_HEATING]
gcode:
    _set_logo COLOR=heating
    _set_nozzle COLOR=heating

[gcode_macro STATUS_COOLING]
gcode:
    _set_logo COLOR=cooling
    _set_nozzle COLOR=cooling

[gcode_macro STATUS_HOMING]
gcode:
    _set_logo COLOR=homing
    _set_nozzle COLOR=homing

[gcode_macro STATUS_LEVELING]
gcode:
    _set_logo COLOR=leveling
    _set_nozzle COLOR=leveling

[gcode_macro STATUS_MESHING]
gcode:
    _set_logo COLOR=meshing
    _set_nozzle COLOR=meshing

[gcode_macro STATUS_CALIBRATING_Z]
gcode:
    _set_logo COLOR=calibrating_z
    _set_nozzle COLOR=calibrating_z

[gcode_macro STATUS_PRINTING]
gcode:
    _set_logo COLOR=printing
    _set_nozzle COLOR=printing

[gcode_macro STATUS_PAUSE]
gcode:
    _set_logo COLOR=pause
    _set_nozzle COLOR=pause

[gcode_macro STATUS_ERROR]
gcode:
    _set_logo COLOR=error
    _set_nozzle COLOR=error

#####################################################################
#   Automatic status monitor
#####################################################################
# Polls every 1s and picks the color from live printer state. A true
# Klipper *shutdown* halts all gcode, so LEDs can't update in that
# state; this covers everything short of that.

[gcode_macro SB_AUTO]
description: Enable/disable automatic LED status (SB_AUTO ENABLE=0|1)
gcode:
    SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=auto VALUE={ (params.ENABLE|default(1)|int != 0) }

[delayed_gcode _sb_status_monitor]
initial_duration: 1
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% if v.auto %}
        {% set ps = printer.print_stats.state %}
        {% set it = printer.idle_timeout.state %}
        {% set e_t = printer.extruder.target %}
        {% set e_c = printer.extruder.temperature %}
        {% set b_t = printer.heater_bed.target %}
        {% set b_c = printer.heater_bed.temperature %}
        {% set d = v.heat_delta %}
        {% set heating = (e_t > 0 and (e_t - e_c) > d) or (b_t > 0 and (b_t - b_c) > d) %}
        {% set hot = (e_t == 0 and e_c > v.cool_temp) or (b_t == 0 and b_c > v.cool_temp) %}
        {% set ns = namespace(s='off') %}
        {% if ps == 'error' %}
            {% set ns.s = 'error' %}
        {% elif ps == 'paused' %}
            {% set ns.s = 'pause' %}
        {% elif ps == 'printing' %}
            {% set ns.s = 'heating' if heating else 'printing' %}
        {% elif it == 'Idle' %}
            {% set ns.s = 'off' %}
        {% elif heating %}
            {% set ns.s = 'heating' %}
        {% elif hot %}
            {% set ns.s = 'cooling' %}
        {% else %}
            {% set ns.s = 'off' %}
        {% endif %}
        {% if ns.s != v.current %}
            {% if   ns.s == 'error'    %} STATUS_ERROR
            {% elif ns.s == 'pause'    %} STATUS_PAUSE
            {% elif ns.s == 'printing' %} STATUS_PRINTING
            {% elif ns.s == 'heating'  %} STATUS_HEATING
            {% elif ns.s == 'cooling'  %} STATUS_COOLING
            {% else %} STATUS_OFF
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=current VALUE='"{ns.s}"'
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_sb_status_monitor DURATION=1

#####################################################################
#   Transient-action wrappers (homing / mesh calibration)
#####################################################################
# These run as single blocking commands, so the monitor can't overwrite
# them mid-move; it resumes control on the next tick when they finish.

[gcode_macro G28]
rename_existing: G28.1
gcode:
    STATUS_HOMING
    SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=current VALUE='"homing"'
    G28.1 {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
    STATUS_MESHING
    SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=current VALUE='"meshing"'
    BASE_BED_MESH_CALIBRATE {rawparams}
