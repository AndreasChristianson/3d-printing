#####################################################################
#   Status LEDs: Stealthburner + BoxTurtle corners  (status-driven)
#####################################################################
#
# Drives [neopixel sb_leds] (in printer.cfg) and [neopixel bt_corners]
# (in AFC/AFC_Turtle_1.cfg) with one shared state:
#
#   state       SB                  BT corners
#   off         off                 off           idle, steppers off
#   ready       white               white         idle, steppers on
#   busy        purple (homing)     purple (tool change)
#   heating     orange              orange
#   attention   red                 red           heater on but not printing,
#                                                 paused (user or AFC), print error
#   printing    green               green
#   cooling     blue                blue          heaters off, still > cool_temp
#
# "busy" lights only the device doing the work; the other keeps its
# last color. Nothing pulses: every state is solid, so the monitor only
# sends LED updates on a state change (keeps Turtle_1 USB traffic low).
#
# sb_leds: chain_count 3 -> index 1 = logo, 2 & 3 = nozzle, RGBW, so
# colors are (R, G, B, W). bt_corners is GRB: colors are (R, G, B).
# Each 0.0-1.0.
#
# The 1 s monitor can't run while a blocking command (G28, M109, M190,
# CHANGE_TOOL, ...) holds the gcode queue, so those set their state up
# front via the wrappers at the bottom and in AFC/AFC_status_leds.cfg;
# the monitor takes back over on its next tick after they finish.
# Klipper shutdown stops all gcode, so the LEDs freeze on their last
# color.
#
# Manual override for testing: run any STATUS_* macro. To stop the
# monitor from taking back over, run  SB_AUTO ENABLE=0  (SB_AUTO ENABLE=1
# to resume).
#####################################################################

[gcode_macro _sb_vars]
# Central place to tweak colors, pixel mapping, and monitor behavior.
variable_logo_led_name:         "sb_leds"   ; neopixel name (no [neopixel ])
variable_logo_idx:              "1"         ; logo pixel index
variable_nozzle_idx:            "2,3"       ; nozzle pixel indices
variable_bt_led_name:           "bt_corners" ; BoxTurtle corner neopixel (all pixels)
variable_heat_delta:            2.0         ; >this far below target = "heating"
variable_cool_temp:             50.0        ; above this with heaters off = "cooling"
variable_nozzle_default_white:  1.0         ; nozzle white while printing, normally
variable_nozzle_print_white:    1.0         ; current level; SB_NOZZLE_LIGHT WHITE=x overrides it,
                                            ; SB_NOZZLE_LIGHT with no WHITE restores the default
                                            ; (print-watcher overrides it only while watching)
variable_motion_steppers:       ["stepper_x", "stepper_y", "stepper_z", "extruder"]
                                            ; any enabled -> "ready" (AFC lane steppers ignored)

# monitor state (do not edit; managed at runtime)
variable_auto:                  True        ; monitor drives the LEDs
variable_sb:                    "init"      ; last state applied to the SB
variable_bt:                    "init"      ; last state applied to the BT corners

variable_colors: {
        'logo': {
            'off':        (0.0, 0.0, 0.0, 0.0),
            'ready':      (0.0, 0.0, 0.0, 0.3),
            'busy':       (0.4, 0.0, 0.6, 0.0),
            'heating':    (0.8, 0.3, 0.0, 0.0),
            'attention':  (0.8, 0.0, 0.0, 0.0),
            'printing':   (0.0, 0.4, 0.0, 0.0),
            'cooling':    (0.0, 0.1, 0.6, 0.0),
        },
        'nozzle': {
            'off':        (0.0, 0.0, 0.0, 0.0),
            'ready':      (0.0, 0.0, 0.0, 0.3),
            'busy':       (0.0, 0.0, 0.0, 0.3),
            'heating':    (0.8, 0.3, 0.0, 0.0),
            'attention':  (0.8, 0.0, 0.0, 0.0),
            'printing':   (0.0, 0.0, 0.0, 1.0),     ; white level comes from nozzle_print_white
            'cooling':    (0.0, 0.1, 0.6, 0.0),
        },
        'bt': {
            'off':        (0.0, 0.0, 0.0),
            'ready':      (0.25, 0.25, 0.25),
            'busy':       (0.4, 0.0, 0.6),
            'heating':    (0.8, 0.3, 0.0),
            'attention':  (0.8, 0.0, 0.0),
            'printing':   (0.0, 0.5, 0.0),
            'cooling':    (0.0, 0.1, 0.6),
        }
    }
gcode:
# no-op; this macro only holds variables

#####################################################################
#   Low-level helpers
#####################################################################

[gcode_macro _set_sb_leds]
gcode:
    {% set r = params.RED|default(0)|float %}
    {% set g = params.GREEN|default(0)|float %}
    {% set b = params.BLUE|default(0)|float %}
    {% set w = params.WHITE|default(0)|float %}
    {% set led = printer["gcode_macro _sb_vars"].logo_led_name %}
    {% set idx = params.IDX|string %}
    {% for i in idx.split(',') %}
        set_led led={led} red={r} green={g} blue={b} white={w} index={i} transmit={loop.last|int}
    {% endfor %}

[gcode_macro _STATUS_SET]
description: Apply a status (STATE=off|ready|busy|heating|attention|printing|cooling DEV=both|sb|bt)
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% set s = params.STATE|lower %}
    {% set dev = params.DEV|default("both")|lower %}
    {% if s not in v.colors.logo %}
        { action_raise_error("_STATUS_SET: unknown STATE '%s'" % s) }
    {% endif %}
    {% if dev in ("both", "sb") and v.sb != s %}
        {% set c = v.colors.logo[s] %}
        _set_sb_leds IDX={v.logo_idx} RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={c[3]}
        {% set c = v.colors.nozzle[s] %}
        {% set w = v.nozzle_print_white if s == "printing" else c[3] %}
        _set_sb_leds IDX={v.nozzle_idx} RED={c[0]} GREEN={c[1]} BLUE={c[2]} WHITE={w}
        SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=sb VALUE='"{s}"'
    {% endif %}
    {% if dev in ("both", "bt") and v.bt != s and ("neopixel " ~ v.bt_led_name) in printer %}
        {% set c = v.colors.bt[s] %}
        SET_LED LED={v.bt_led_name} RED={c[0]} GREEN={c[1]} BLUE={c[2]}
        SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=bt VALUE='"{s}"'
    {% endif %}

#####################################################################
#   Status macros (manual / mainsail.cfg pause-resume-cancel hooks)
#####################################################################
# Kept under their old names; homing/leveling/meshing/calibrating are
# all "busy" now, pause/error are both "attention". They set both
# devices; the monitor corrects anything stale on its next tick.

[gcode_macro STATUS_OFF]
gcode:
    _STATUS_SET STATE=off

[gcode_macro STATUS_READY]
gcode:
    _STATUS_SET STATE=ready

[gcode_macro STATUS_BUSY]
gcode:
    _STATUS_SET STATE=busy

[gcode_macro STATUS_HEATING]
gcode:
    _STATUS_SET STATE=heating

[gcode_macro STATUS_COOLING]
gcode:
    _STATUS_SET STATE=cooling

[gcode_macro STATUS_HOMING]
gcode:
    _STATUS_SET STATE=busy DEV=sb

[gcode_macro STATUS_LEVELING]
gcode:
    _STATUS_SET STATE=busy DEV=sb

[gcode_macro STATUS_MESHING]
gcode:
    _STATUS_SET STATE=busy DEV=sb

[gcode_macro STATUS_CALIBRATING_Z]
gcode:
    _STATUS_SET STATE=busy DEV=sb

[gcode_macro STATUS_PRINTING]
gcode:
    _STATUS_SET STATE=printing

[gcode_macro SB_NOZZLE_LIGHT]
description: Nozzle LED white level while printing (SB_NOZZLE_LIGHT WHITE=0.0-1.0; no WHITE = default)
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% set w = [[params.WHITE|default(v.nozzle_default_white)|float, 0.0]|max, 1.0]|min %}
    SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=nozzle_print_white VALUE={w}
    {% if v.sb == "printing" %}
        _set_sb_leds IDX={v.nozzle_idx} WHITE={w}
    {% endif %}

[gcode_macro STATUS_PAUSE]
gcode:
    _STATUS_SET STATE=attention

[gcode_macro STATUS_ERROR]
gcode:
    _STATUS_SET STATE=attention

#####################################################################
#   Automatic status monitor
#####################################################################
# Polls every 1s and picks the state from live printer state. "busy"
# is never chosen here; it's only set by the wrappers below, and the
# next tick after the wrapped command finishes replaces it.

[gcode_macro SB_AUTO]
description: Enable/disable automatic LED status (SB_AUTO ENABLE=0|1)
gcode:
    SET_GCODE_VARIABLE MACRO=_sb_vars VARIABLE=auto VALUE={ (params.ENABLE|default(1)|int != 0) }

[delayed_gcode _sb_status_monitor]
initial_duration: 1
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% if v.auto %}
        {% set ps = printer.print_stats.state %}
        {% set afc_error = printer.AFC.error_state if "AFC" in printer else False %}
        {% set e_t = printer.extruder.target %}
        {% set e_c = printer.extruder.temperature %}
        {% set b_t = printer.heater_bed.target %}
        {% set b_c = printer.heater_bed.temperature %}
        {% set d = v.heat_delta %}
        {% set heating = (e_t > 0 and (e_t - e_c) > d) or (b_t > 0 and (b_t - b_c) > d) %}
        {% set heater_on = e_t > 0 or b_t > 0 %}
        {% set hot = e_c > v.cool_temp or b_c > v.cool_temp %}
        {% set en = printer.stepper_enable.steppers %}
        {% set ns = namespace(s='off', motors=False) %}
        {% for st in v.motion_steppers %}
            {% if en[st]|default(False) %}
                {% set ns.motors = True %}
            {% endif %}
        {% endfor %}
        {% if ps in ('paused', 'error') or afc_error %}
            {% set ns.s = 'attention' %}
        {% elif ps == 'printing' %}
            {% set ns.s = 'heating' if heating else 'printing' %}
        {% elif heating %}
            {% set ns.s = 'heating' %}
        {% elif heater_on %}
            {% set ns.s = 'attention' %}
        {% elif hot %}
            {% set ns.s = 'cooling' %}
        {% elif ns.motors %}
            {% set ns.s = 'ready' %}
        {% endif %}
        {% if ns.s != v.sb or ns.s != v.bt %}
            _STATUS_SET STATE={ns.s}
        {% endif %}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_sb_status_monitor DURATION=1

#####################################################################
#   Blocking-command wrappers
#####################################################################
# Each runs as a single blocking command, so the monitor can't overwrite
# the state mid-command; it resumes control on the next tick.

# --- SB busy: homing / probing ---

[gcode_macro G28]
rename_existing: G28.1
gcode:
    _STATUS_SET STATE=busy DEV=sb
    G28.1 {rawparams}

[gcode_macro CARTOGRAPHER_TOUCH_HOME]
rename_existing: _BASE_CARTOGRAPHER_TOUCH_HOME
gcode:
    _STATUS_SET STATE=busy DEV=sb
    _BASE_CARTOGRAPHER_TOUCH_HOME {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
gcode:
    _STATUS_SET STATE=busy DEV=sb
    BASE_BED_MESH_CALIBRATE {rawparams}

# --- heating wait (bed) ---
# Orange only if the wait will actually heat. A BT busy with a tool change
# keeps its purple. The M109 and BT tool-change wrappers live in
# AFC/AFC_status_leds.cfg: M109 must load after [AFC] (see there).

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set v = printer["gcode_macro _sb_vars"] %}
    {% if params.S|default(0)|float - printer.heater_bed.temperature > v.heat_delta %}
        _STATUS_SET STATE=heating DEV={ "sb" if v.bt == "busy" else "both" }
    {% endif %}
    M190.1 {rawparams}
